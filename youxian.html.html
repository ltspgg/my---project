<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资料库 | Your Site Name</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 头部导航 -->
    <header>
        <h1>我的资料库</h1>
        <nav>
            文档
            视频
            外部链接
        </nav>
    </header>

    <!-- 内容区域 -->
    <main>
        <!-- 文档部分 -->
        <section id="documents">
            <h2>📁 文档资料</h2>
            <ul>
                <li><a href="docs/report.pdf" download>项目报告（PDF）</a ></li>
                <li>数据表格（Excel）</li>
            </ul>
        </section>

        <!-- 视频部分 -->
        <section id="videos">
            <h2>🎥 视频资料</h2>
            <video controls width="600">
                <source src="videos/demo.mp4" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
        </section>

        <!-- 外部链接 -->
        <section id="links">
            <h2>🔗 相关链接</h2>
            <ul>
                <li></li>
            </ul>
        </section>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>© 2023 Your Name. 联系方式：contact@example.com</p >
    </footer>
</body>
</html>
